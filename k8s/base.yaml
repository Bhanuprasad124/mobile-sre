apiVersion: v1
kind: Namespace
metadata:
  name: mobile-sre
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sre-dashboard
  namespace: mobile-sre
automountServiceAccountToken: true
---
# Cluster-wide permissions are limited to namespace discovery, SelfSubjectAccessReviews,
# and read-only node metadata. Pod/workload access remains namespace-scoped.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mobile-sre-namespace-discovery
rules:
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list"]
- apiGroups: ["authorization.k8s.io"]
  resources: ["selfsubjectaccessreviews"]
  verbs: ["create"]
# Read-only node metadata is needed for cluster node readiness.
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mobile-sre-namespace-discovery
subjects:
- kind: ServiceAccount
  name: sre-dashboard
  namespace: mobile-sre
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mobile-sre-namespace-discovery
---
# Metrics Server access is read-only and limited to node usage metrics.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mobile-sre-metrics-reader
rules:
- apiGroups: ["metrics.k8s.io"]
  resources: ["nodes"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mobile-sre-metrics-reader
subjects:
- kind: ServiceAccount
  name: sre-dashboard
  namespace: mobile-sre
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mobile-sre-metrics-reader
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mobile-sre-platform
  namespace: mobile-sre
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mobile-sre-platform
  template:
    metadata:
      labels:
        app: mobile-sre-platform
    spec:
      serviceAccountName: sre-dashboard
      containers:
      - name: dashboard
        image: bhanuprasad124/mobile-sre:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mobile-sre-platform
  namespace: mobile-sre
spec:
  selector:
    app: mobile-sre-platform
  ports:
  - name: http
    port: 80
    targetPort: http
  type: ClusterIP
